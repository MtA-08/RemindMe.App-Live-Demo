name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
         dotnet-version: '10.0.x'

      - name: Publish App
        run: dotnet publish BlazorApp3/BlazorApp3.csproj -c Release -o release --nologo

      - name: Change base-tag in index.html to match GitHub Pages repository
        run: sed -i 's/<base href="\/" \/>/<base href="\/BlazorTodoApp\/" \/>/g' release/wwwroot/index.html


      - name: Add .nojekyll file
        run: touch release/wwwroot/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: release/wwwroot